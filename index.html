<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kuugu-mei 的博客</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="pixel-theme">
    <div class="falling-container" id="falling-container"></div>
    <header class="header-banner border-corner">
        <h1>Welcome to kuugu-mei's Space</h1>
    </header>
    
    <div class="main-layout">
        <!-- 左侧个人信息 -->
        <aside class="sidebar-left border-corner">
            <div class="avatar-box">
                <img src="images/avatar.png" alt="Avatar" class="avatar-img-large">
            </div>
            <div class="bio-text">
                <h3>kuugu-mei</h3>
                <p>欢迎来到我的像素灵感小屋！记录生活与奇思妙想。</p>
            </div>
            <nav class="nav-menu">
                <a href="index.html" class="active">首页</a>
                <a href="blog.html">日志</a>
                <a href="collection.html">藏品</a>
                <a href="gallery.html">相册</a>
                <a href="about.html">关于我</a>
                <a href="contact.html">联系我</a>
            </nav>
        </aside>

        <!-- 中间主要内容 -->
        <main class="content-center">
            <!-- 公告栏 -->
            <section class="notice-board border-corner">
                <div class="notice-header">
                    <span class="notice-title">📢 站点公告栏</span>
                    <span class="notice-date" id="current-date"></span>
                </div>
                <div class="notice-content">
                    <p class="highlight-text">[更新 v10] 新增【藏品】界面，重构卷轴与边框装饰，嵌入音乐视频！</p>
                </div>
            </section>

            <!-- 主页最新日志（纵向排列） -->
            <section class="latest-posts border-corner">
                <h2>最新日志</h2>
                <div class="vertical-posts-list">
                    <article class="post-item-vertical">
                        <img src="images/avatar.png" class="post-avatar-mini" alt="avatar">
                        <div class="post-info">
                            <h4><a href="blog.html">博客新装上线！</a></h4>
                            <span class="post-time">2026-10-18</span>
                            <p>今天整理了整个博客的布局，加入了更炫酷的像素装饰与隐藏藏品阁...</p>
                        </div>
                    </article>
                    <article class="post-item-vertical">
                        <img src="images/avatar.png" class="post-avatar-mini" alt="avatar">
                        <div class="post-info">
                            <h4><a href="blog.html">关于收藏与心爱之物</a></h4>
                            <span class="post-time">2026-10-17</span>
                            <p>有些物件虽然微小，却承载着满满的回忆。可以在藏品页面看看我的小宝贝们...</p>
                        </div>
                    </article>
                </div>
            </section>

            <!-- 嵌入 YouTube 视频 -->
            <section class="video-section border-corner">
                <h2>Music Box</h2>
                <div class="video-wrapper">
                    <iframe width="100%" height="315" src="https://www.youtube.com/embed/u9J99gB5psc" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
